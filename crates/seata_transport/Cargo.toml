[package]
name = "seata-transport"
description = "Native Seata V1 connection lifecycle and request correlation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
tls = ["dep:tokio-rustls", "dep:sha2"]

[dependencies]
sha2 = { version = "=0.10.9", optional = true }
seata-protocol = { path = "../seata_protocol" }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"], optional = true }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
rcgen = { version = "=0.14.0", default-features = false, features = ["ring"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
