[package]
name = "seata-observability"
description = "Loopback-only authenticated Seata metrics exporter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
structured_log_file = ["structured_logs", "tokio/fs"]
structured_log_layer = ["structured_logs", "dep:tracing-subscriber"]
structured_logs = ["dep:tracing", "dep:serde_json"]
mysql = ["dep:seata-db-mysql"]

[dependencies]
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry"], optional = true }
tracing = { workspace = true, optional = true }
serde_json = { version = "=1.0.140", optional = true }
seata-db-mysql = { path = "../seata_db_mysql", optional = true }
seata-transport = { path = "../seata_transport" }
seata-tm = { path = "../seata_tm" }
seata-rm = { path = "../seata_rm" }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
seata-at = { path = "../seata_at" }
seata-protocol = { path = "../seata_protocol" }

[lints]
workspace = true
