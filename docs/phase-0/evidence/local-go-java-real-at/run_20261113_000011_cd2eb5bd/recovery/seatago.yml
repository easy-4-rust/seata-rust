seata:
  application-id: real-at-full-sdk
  tx-service-group: real_at
  registry:
    type: file
  service:
    vgroup-mapping:
      real_at: owned
    grouplist:
      owned: 127.0.0.1:28092
  transport:
    protocol: seata
    enable-tm-client-batch-send-request: false
    enable-rm-client-batch-send-request: false
  remoting:
    java-v1-profile: true
    reconnect-interval: 50000000
    session:
      tcp-read-timeout: 5s
      tcp-write-timeout: 5s
      cron-period: 250ms
      max-msg-len: 8388608
  client:
    tm:
      commit-retry-count: 1
      rollback-retry-count: 1
