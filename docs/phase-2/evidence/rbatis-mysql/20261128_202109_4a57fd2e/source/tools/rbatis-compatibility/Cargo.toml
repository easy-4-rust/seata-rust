[package]
name="seata-rbatis-compatibility-probe"
version="0.1.0"
edition="2021"
rust-version="1.85"
[dependencies]
rbatis="=4.9.11"
rbs="=4.8.4"
serde={version="=1.0.229",features=["derive"]}
tokio={version="=1.54.1",features=["macros","rt-multi-thread"]}
futures-core="=0.3.34"
[patch.crates-io]
time = { path = "../../third_party/time" }
rbatis-macro-driver={path="../../third_party/rbatis_macro_driver"}
rbatis={path="../../third_party/rbatis"}
rbdc={path="../../third_party/rbdc"}
scraper={path="../../third_party/scraper"}
[profile.test]
debug=0

[workspace]
