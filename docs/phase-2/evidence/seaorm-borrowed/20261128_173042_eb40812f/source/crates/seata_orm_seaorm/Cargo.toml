[package]
name = "seata-orm-seaorm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SeaORM MySQL DML adapter for the owned Seata AT transaction"

[features]
borrowed_connection = ["dep:async-trait", "dep:tokio", "sea-orm/sqlx-mysql", "sea-orm/proxy"]
experimental_changed_commit = ["seata-db-mysql/experimental_changed_commit"]

[dependencies]
async-trait = { version = "=0.1.92", optional = true }
tokio = { workspace = true, optional = true }
sea-orm = { version = "=1.1.19", default-features = false, features = ["macros", "with-json", "with-bigdecimal", "with-chrono"] }
seata-at = { path = "../seata_at" }
seata-datasource = { path = "../seata_datasource" }
seata-db-mysql = { path = "../seata_db_mysql" }
thiserror.workspace = true
serde_json = "=1.0.140"

[lints]
workspace = true

[dev-dependencies]
serde_json = "=1.0.140"
tokio.workspace = true


seata-protocol = { path = "../seata_protocol" }
seata-transport = { path = "../seata_transport" }
seata-rm = { path = "../seata_rm" }
seata-tm = { path = "../seata_tm" }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["mysql", "runtime-tokio"] }
